[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-mcp-server"
version = "0.0.1"
description = "基于 MCP 的 Excel 文件处理服务器 —— 支持合并、拆分、多 Sheet 导出。"

requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/Lemoween/excel-mcp-server"
Repository = "https://github.com/Lemoween/excel-mcp-server"
"Bug Tracker" = "https://github.com/Lemoween/excel-mcp-server/issues"

[tool.setuptools]
packages = ["excel_mcp_server", "excel_mcp_server.tools"]